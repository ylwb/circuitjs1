name: Build GWT (transistor render)

on:
  workflow_dispatch:
    inputs:
      gwt_ver:
        description: 'GWT version'
        required: false
        default: '2.8.2'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 8
      uses: actions/setup-java@v4
      with:
        java-version: '8'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Build GWT
      run: ./gradlew compileGwt --console verbose

    - name: Build site
      run: ./gradlew makeSite --console verbose

    - name: List site output
      run: |
        echo "=== site/ tree ==="
        find site -type f | head -50
        echo "=== circuitjs1 dir ==="
        ls -la site/circuitjs1/ 2>/dev/null | head -20

    - name: Package site
      run: tar czf circuitjs1-site.tar.gz site/

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: circuitjs1-site
        path: circuitjs1-site.tar.gz
        retention-days: 7
